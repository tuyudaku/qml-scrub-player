name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          modules: qtmultimedia

      - name: Install FFmpeg development libraries
        run: sudo apt-get update && sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Configure
        run: cmake -S . -B build -DQMLSCRUBPLAYER_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel
